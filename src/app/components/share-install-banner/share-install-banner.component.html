@if (visible) {
  <div class="share-install-banner" role="region" [attr.aria-label]="'ShareInstallBanner.Region' | translate">
    <div class="share-install-banner__badges">
      <a [href]="appStoreUrl" target="_blank" rel="noopener" (click)="onBadge('ios')">
        <img class="share-install-banner__apple" [src]="appStoreBadgeUrl" alt="Download on the App Store">
      </a>
      <a [href]="playStoreUrl" target="_blank" rel="noopener" aria-label="Get app from google play store" (click)="onBadge('android')">
        <img [src]="playStoreBadgeUrl" alt="google play store">
      </a>
    </div>
    <p class="share-install-banner__copy">{{ 'ShareInstallBanner.Title' | translate }}</p>
    <button type="button" class="share-install-banner__close" (click)="dismiss()" [attr.aria-label]="'Close' | translate">
      <fa-icon [icon]="['fas', 'times']"></fa-icon>
    </button>
  </div>
}

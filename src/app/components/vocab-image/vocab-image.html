@if (images) {
  <ion-card class="card">
    <div class="image-stage">
      <div class="image-clip">
        <img [@move]="state" (@move.done)="onDone($event)" [src]="imageBase64 | safeHtml" class="image" alt="" />
      </div>
      <button type="button" class="nav-button nav-prev"
        [disabled]="images?.length <= 1"
        [attr.aria-label]="'VocabImage.Previous' | translate"
        (click)="previousImage()">
        <fa-icon [icon]="['fas', 'angle-left']"></fa-icon>
      </button>
      <button type="button" class="nav-button nav-next"
        [disabled]="images?.length <= 1"
        [attr.aria-label]="'VocabImage.Next' | translate"
        (click)="nextImage()">
        <fa-icon [icon]="['fas', 'angle-right']"></fa-icon>
      </button>
    </div>
    @if (showUnverifiedNote) {
      <div class="unverified-note-row">
        <fa-icon [icon]="['fas', 'circle-info']"></fa-icon>
        <ion-note color="medium">{{ 'VocabImage.UnverifiedAiNote' | translate }}</ion-note>
      </div>
    }
  </ion-card>
}

@if (images) {
  <ion-card class="card">
    <div class="image-stage">
      <div class="image-clip">
        <img [@move]="state" (@move.done)="onDone($event)" [src]="imageBase64 | safeHtml" class="image" alt="" />
      </div>
      <ion-button fill="clear" shape="round" class="nav-button nav-prev"
        [disabled]="!canCycle"
        [attr.aria-label]="'VocabImage.Previous' | translate"
        (click)="previousImage()">
        <fa-icon [icon]="['fas', 'angle-left']"></fa-icon>
      </ion-button>
      <ion-button fill="clear" shape="round" class="nav-button nav-next"
        [disabled]="!canCycle"
        [attr.aria-label]="'VocabImage.Next' | translate"
        (click)="nextImage()">
        <fa-icon [icon]="['fas', 'angle-right']"></fa-icon>
      </ion-button>
    </div>
    @if (canReport && !showingPlaceholder) {
      <div class="report-row">
        <ion-button fill="clear" size="small" type="button" color="medium"
          class="report-image-button"
          [disabled]="!reportEnabled"
          (click)="reportImage($event)">
          {{ 'VocabImage.Report' | translate }}
        </ion-button>
      </div>
    }
  </ion-card>
}
